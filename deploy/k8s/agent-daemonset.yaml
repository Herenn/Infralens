apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: infralens-agent
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: infralens
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infralens
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: infralens-agent
      hostPID: true
      hostNetwork: true
      containers:
        - name: agent
          image: ghcr.io/herenn/infralens/agent:latest
          imagePullPolicy: Never
          args:
            - --backend=infralens-backend.infralens.svc.cluster.local:8080
            - --poll-interval=1s
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - NET_ADMIN
                - SYS_RESOURCE
          volumeMounts:
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: sys
          hostPath:
            path: /sys
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infralens-agent
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infralens-agent
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infralens-agent
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: agent
subjects:
  - kind: ServiceAccount
    name: infralens-agent
    namespace: infralens
roleRef:
  kind: ClusterRole
  name: infralens-agent
  apiGroup: rbac.authorization.k8s.io
