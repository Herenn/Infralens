apiVersion: apps/v1
kind: Deployment
metadata:
  name: infralens-frontend
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infralens
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infralens
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: infralens/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: infralens-frontend
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infralens
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: infralens.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infralens-frontend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: infralens-backend
                port:
                  name: http
