apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infralens-backend-data
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infralens-backend
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: the backend owns a ReadWriteOnce
  # PVC. RollingUpdate would start the new pod first, which either deadlocks on
  # Multi-Attach (different node) or puts two writers on one SQLite file (same
  # node).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: infralens
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infralens
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: infralens-backend
      # Matches the nonroot uid/gid in the distroless backend image. fsGroup is
      # what makes the PVC mounted at /data writable by it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: infralens-backend-data
      containers:
        - name: backend
          image: ghcr.io/herenn/infralens/backend:latest
          imagePullPolicy: IfNotPresent
          args:
            - --listen=:8080
            - --debug
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            # UI login (opt-in; without it reads are public as in v3.0).
            # 1. Create the Secret:
            #      kubectl -n infralens create secret generic infralens-ui-auth \
            #        --from-literal=ui-password="$(openssl rand -base64 24)" \
            #        --from-literal=session-secret="$(openssl rand -hex 32)"
            # 2. Uncomment the two entries below. They are deliberately not
            #    optional: if the Secret or a key is missing (a typo), the pod
            #    refuses to start (CreateContainerConfigError) instead of
            #    silently serving the UI without a login.
            # - name: UI_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: infralens-ui-auth
            #       key: ui-password
            # - name: SESSION_SECRET
            #   valueFrom:
            #     secretKeyRef:
            #       name: infralens-ui-auth
            #       key: session-secret
            # Topology history. Retention is in days and decides how far back
            # the timeline scrubs; unrelated to PRUNE_MAX_AGE (current state).
            - name: HISTORY_ENABLED
              value: "true"
            - name: HISTORY_RETENTION
              value: "720h"
            - name: HISTORY_MAX_GAP
              value: "5m"
            # Architecture drift detection - the UI's Changes feed (v3.1).
            # Optional webhook: DRIFT_WEBHOOK_URL.
            - name: DRIFT_ENABLED
              value: "true"
            # MCP endpoint (/mcp) for AI assistants (v3.1). Give AI clients a
            # read-only key valid on /mcp only (with UI_PASSWORD set and no
            # key, /mcp refuses every request):
            #      kubectl -n infralens create secret generic infralens-mcp \
            #        --from-literal=mcp-api-key="$(openssl rand -hex 32)"
            - name: MCP_ENABLED
              value: "true"
            # - name: MCP_API_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: infralens-mcp
            #       key: mcp-api-key
            # Idle spend (v3.1, beta): no prices are built in; set a node
            # price to see costs. See deploy/docker-compose/env.example.
            # - name: IDLE_COST_NODE_MONTHLY
            #   value: "140"
          volumeMounts:
            # The backend's SQLite database lives in the image WORKDIR (/data).
            # Without this the container root is not writable by the nonroot
            # user and the backend cannot create its database at all.
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: infralens-backend
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infralens-backend
  namespace: infralens
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
---
# ClusterRole for reading Pods and Services (required for K8s service discovery)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infralens-backend
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infralens-backend
  labels:
    app.kubernetes.io/name: infralens
    app.kubernetes.io/component: backend
subjects:
  - kind: ServiceAccount
    name: infralens-backend
    namespace: infralens
roleRef:
  kind: ClusterRole
  name: infralens-backend
  apiGroup: rbac.authorization.k8s.io
