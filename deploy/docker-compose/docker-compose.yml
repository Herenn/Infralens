# InfraLens Docker Compose
# ========================
# For single-server deployments and development
#
# Usage (build locally):
#   docker-compose up -d --build
#
# Usage (use pre-built images):
#   docker-compose up -d
#
# With AI features:
#   OPENAI_API_KEY=sk-xxx docker-compose up -d

services:
  # ===========================
  # Backend - API & WebSocket Server
  # ===========================
  backend:
    image: ghcr.io/herenn/infralens/backend:latest
    build:
      context: ../../
      dockerfile: Dockerfile.backend
    container_name: infralens-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Agent authentication (optional, empty = disabled)
      - API_KEY=${API_KEY:-}
      # Set ALLOW_NO_AUTH=true to start without an API key (development only).
      - ALLOW_NO_AUTH=${ALLOW_NO_AUTH:-}
      # AI Documentation (optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-haiku-20240307}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-pro}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openai}
      # Topology history. Retention is measured in days and is what decides how
      # far back the timeline can scrub; it is unrelated to PRUNE_MAX_AGE, which
      # governs current state in minutes.
      - HISTORY_ENABLED=${HISTORY_ENABLED:-true}
      - HISTORY_RETENTION=${HISTORY_RETENTION:-720h}
      - HISTORY_MAX_GAP=${HISTORY_MAX_GAP:-5m}
    volumes:
      # The backend's SQLite database lives in the image's WORKDIR (/data).
      # Without this volume every restart discards it - and topology history,
      # unlike current state, cannot be re-derived by the agents.
      - infralens-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - infralens

  # ===========================
  # Frontend - React UI
  # ===========================
  frontend:
    image: ghcr.io/herenn/infralens/frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: infralens-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - infralens

  # ===========================
  # Agent - eBPF Network Monitor
  # ===========================
  # NOTE: Agent requires privileged mode for eBPF
  # On Linux servers with BTF support (kernel 5.8+)
  agent:
    image: ghcr.io/herenn/infralens/agent:latest
    build:
      context: ../../
      dockerfile: Dockerfile.agent
    container_name: infralens-agent
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    security_opt:
      - apparmor:unconfined
    command:
      - --backend=http://localhost:8080
      - --node=${HOSTNAME:-docker-host}
      - --inspect
    environment:
      - INFRALENS_API_KEY=${API_KEY:-}
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:rw
      - /sys/kernel/debug:/sys/kernel/debug:rw
    depends_on:
      - backend

volumes:
  infralens-data:

networks:
  infralens:
    driver: bridge
