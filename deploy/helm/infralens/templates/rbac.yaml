{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infralens.serviceAccountName" . }}
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "infralens.fullname" . }}
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
rules:
  # Read pods, services, endpoints for service discovery
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
  # Read deployments, replicasets for additional context
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "infralens.fullname" . }}
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "infralens.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "infralens.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
