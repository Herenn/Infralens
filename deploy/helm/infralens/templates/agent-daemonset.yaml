{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "infralens.fullname" . }}-agent
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "infralens.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infralens.agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "infralens.serviceAccountName" . }}
      hostNetwork: true
      hostPID: true
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            {{- if .Values.agent.externalBackend.enabled }}
            - --backend={{ .Values.agent.externalBackend.url }}
            {{- else }}
            - --backend=http://{{ include "infralens.fullname" . }}-backend:{{ .Values.backend.service.port }}
            {{- end }}
            - --node=$(NODE_NAME)
            - --inspect
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
