{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "infralens.fullname" . }}-agent
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "infralens.agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infralens.agent.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the agents with the backend when the chart's Secret changes:
        # they read INFRALENS_API_KEY from it at start, so rotating
        # auth.apiKey with `helm upgrade` would otherwise restart only the
        # backend (checksum on its pod too) and leave every agent sending the
        # old key - all ingest refused until the DaemonSet is restarted by
        # hand.
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "infralens.serviceAccountName" . }}
      hostNetwork: true
      # With hostNetwork the default policy uses the node's resolv.conf, which
      # cannot resolve the backend Service name passed in --backend.
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: true
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          args:
            {{- if .Values.agent.externalBackend.enabled }}
            - --backend={{ .Values.agent.externalBackend.url }}
            {{- else }}
            - --backend=http://{{ include "infralens.fullname" . }}-backend:{{ .Values.backend.service.port }}
            {{- end }}
            - --node=$(NODE_NAME)
            {{- if .Values.agent.clusterName }}
            - --cluster={{ .Values.agent.clusterName }}
            {{- end }}
            - --inspect
            {{- if eq (toString .Values.agent.dnsNames) "true" }}
            - --dns-names=true
            {{- with .Values.agent.dns }}
            {{- /* Set unless empty or null: a plain `if` would drop an explicit 0 ("0 disables" the stats log). */}}
            {{- if and (not (kindIs "invalid" .maxPPS)) (ne (toString .maxPPS) "") }}
            - --dns-max-pps={{ .maxPPS }}
            {{- end }}
            {{- if and (not (kindIs "invalid" .cacheSize)) (ne (toString .cacheSize) "") }}
            - --dns-cache-size={{ .cacheSize }}
            {{- end }}
            {{- if and (not (kindIs "invalid" .statsInterval)) (ne (toString .statsInterval) "") }}
            - --dns-stats-interval={{ .statsInterval }}
            {{- end }}
            {{- end }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .Values.backend.auth.apiKey }}
            - name: INFRALENS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: api-key
            {{- end }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          volumeMounts:
            - name: proc
              mountPath: /proc
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
