{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infralens.fullname" . }}-backend
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  {{- if .Values.backend.persistence.enabled }}
  # Recreate, not the default RollingUpdate, because the backend owns a
  # ReadWriteOnce volume. RollingUpdate starts the replacement pod before
  # terminating the old one, and both outcomes are bad: on a different node the
  # new pod blocks forever on Multi-Attach and the rollout deadlocks; on the
  # same node RWO lets both attach, so two processes write one SQLite file.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "infralens.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infralens.backend.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pods when the chart's Secret changes: env vars from a
        # Secret are only read at container start, so without this a
        # `helm upgrade` that rotates uiPassword/apiKey would leave the old
        # (possibly leaked) values live. Not covered: backend.auth.existingSecret,
        # which the chart does not manage - restart the Deployment yourself.
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "infralens.serviceAccountName" . }}
      # fsGroup is what makes the mounted volume writable. The image runs as
      # nonroot (uid 65532) and the volume mounted at /data replaces the
      # image's nonroot-owned directory; without fsGroup a PVC typically
      # arrives root-owned and SQLite cannot create its database - the same
      # startup failure the WORKDIR change fixes, one layer up.
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.backend.auth.apiKey }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: api-key
            {{- end }}
            {{- if .Values.backend.auth.allowNoAuth }}
            - name: ALLOW_NO_AUTH
              value: "true"
            {{- end }}
            {{- with .Values.backend.auth }}
            {{- if or .uiPassword .existingSecret }}
            # UI login: read endpoints and the WebSocket need a session or API_KEY.
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | default (printf "%s-secrets" (include "infralens.fullname" $)) }}
                  key: ui-password
            - name: UI_USERNAME
              value: {{ .uiUsername | default "admin" | quote }}
            - name: SESSION_TTL
              value: {{ .sessionTTL | default "12h" | quote }}
            {{- if .trustedProxies }}
            - name: TRUSTED_PROXIES
              value: {{ .trustedProxies | quote }}
            {{- end }}
            {{- if or .sessionSecret .existingSecret }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret | default (printf "%s-secrets" (include "infralens.fullname" $)) }}
                  key: session-secret
                  {{- if .existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.backend.demoMode }}
            - name: DEMO_MODE
              value: "true"
            {{- end }}
            # AI Configuration
            {{- if .Values.backend.ai.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: openai-api-key
            {{- end }}
            - name: OPENAI_MODEL
              value: {{ .Values.backend.ai.openai.model | quote }}
            {{- if .Values.backend.ai.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: anthropic-api-key
            {{- end }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.backend.ai.anthropic.model | quote }}
            {{- if .Values.backend.ai.gemini.apiKey }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: gemini-api-key
            {{- end }}
            - name: GEMINI_MODEL
              value: {{ .Values.backend.ai.gemini.model | quote }}
            {{- if .Values.backend.ai.ollama.url }}
            - name: OLLAMA_URL
              value: {{ .Values.backend.ai.ollama.url | quote }}
            {{- end }}
            - name: OLLAMA_MODEL
              value: {{ .Values.backend.ai.ollama.model | quote }}
            - name: DEFAULT_LLM_PROVIDER
              value: {{ .Values.backend.ai.defaultProvider | quote }}
            # Topology history. Retention is in days and decides how far back
            # the timeline scrubs; unrelated to PRUNE_MAX_AGE (current state,
            # minutes).
            - name: HISTORY_ENABLED
              value: {{ .Values.backend.history.enabled | quote }}
            - name: HISTORY_RETENTION
              value: {{ .Values.backend.history.retention | quote }}
            - name: HISTORY_MAX_GAP
              value: {{ .Values.backend.history.maxGap | quote }}
            # Architecture drift detection / Changes feed. The timings apply
            # whether or not a webhook is configured: detection always runs
            # (with history) and feeds the UI. Unset ones use the backend's
            # defaults (demo mode has its own, much faster ones).
            - name: DRIFT_ENABLED
              value: {{ .Values.backend.drift.enabled | quote }}
            {{- with .Values.backend.drift }}
            {{- if and (not (kindIs "invalid" .checkInterval)) (ne (toString .checkInterval) "") }}
            - name: DRIFT_CHECK_INTERVAL
              value: {{ .checkInterval | quote }}
            {{- end }}
            {{- if and (not (kindIs "invalid" .goneAfter)) (ne (toString .goneAfter) "") }}
            - name: DRIFT_GONE_AFTER
              value: {{ .goneAfter | quote }}
            {{- end }}
            {{- end }}
            {{- if and (not (kindIs "invalid" .Values.backend.drift.warmup)) (ne (toString .Values.backend.drift.warmup) "") }}
            - name: DRIFT_WARMUP
              value: {{ .Values.backend.drift.warmup | quote }}
            {{- end }}
            # MCP endpoint (/mcp) for AI assistants.
            - name: MCP_ENABLED
              value: {{ .Values.backend.mcp.enabled | quote }}
            {{- if .Values.backend.mcp.allowedOrigins }}
            - name: MCP_ALLOWED_ORIGINS
              value: {{ .Values.backend.mcp.allowedOrigins | quote }}
            {{- end }}
            {{- if .Values.backend.mcp.apiKey }}
            # Read-only key accepted on /mcp only.
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: mcp-api-key
            {{- end }}
            {{- if .Values.backend.drift.webhookUrl }}
            # Optional drift webhook (Slack/Mattermost-compatible).
            - name: DRIFT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: drift-webhook-url
            {{- end }}
            # Idle spend estimation. Empty values mean "unset".
            - name: IDLE_COST_NODE_MONTHLY
              value: {{ .Values.backend.idleCost.nodeMonthly | quote }}
            - name: IDLE_COST_NODE_PRICES
              value: {{ .Values.backend.idleCost.nodePrices | quote }}
            - name: IDLE_COST_SERVICE_PRICES
              value: {{ .Values.backend.idleCost.servicePrices | quote }}
            - name: IDLE_COST_CURRENCY
              value: {{ .Values.backend.idleCost.currency | quote }}
            - name: IDLE_COST_EXCLUDE
              value: {{ .Values.backend.idleCost.exclude | quote }}
            - name: IDLE_COST_WINDOW
              value: {{ .Values.backend.idleCost.window | quote }}
            - name: IDLE_COST_QUIET_AFTER
              value: {{ .Values.backend.idleCost.quietAfter | quote }}
            - name: IDLE_COST_WARMUP
              value: {{ .Values.backend.idleCost.warmup | quote }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            # The backend's SQLite database lives in the image WORKDIR (/data).
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "infralens.fullname" . }}-data
          {{- else }}
          # Ephemeral. Current state is repopulated by the agents within
          # seconds, but topology history cannot be re-derived - enable
          # persistence before relying on the timeline, diff, or decommission
          # views.
          emptyDir: {}
          {{- end }}
{{- if .Values.backend.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "infralens.fullname" . }}-data
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- if .Values.backend.persistence.retainOnDelete }}
  annotations:
    # Survives `helm uninstall` and a failed-upgrade rollback. Deliberate: the
    # topology history on this volume cannot be re-derived - unlike current
    # state, which the agents repopulate within seconds - so the default is to
    # orphan the PVC rather than destroy the data. Delete it by hand when you
    # actually mean to, or set persistence.retainOnDelete=false.
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.backend.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infralens.fullname" . }}-backend
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "infralens.backend.selectorLabels" . | nindent 4 }}
{{- end }}
