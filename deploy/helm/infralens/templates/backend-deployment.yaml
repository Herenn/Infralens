{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infralens.fullname" . }}-backend
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "infralens.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infralens.backend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "infralens.serviceAccountName" . }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # AI Configuration
            {{- if .Values.backend.ai.openai.apiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: openai-api-key
            {{- end }}
            - name: OPENAI_MODEL
              value: {{ .Values.backend.ai.openai.model | quote }}
            {{- if .Values.backend.ai.anthropic.apiKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: anthropic-api-key
            {{- end }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.backend.ai.anthropic.model | quote }}
            {{- if .Values.backend.ai.gemini.apiKey }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "infralens.fullname" . }}-secrets
                  key: gemini-api-key
            {{- end }}
            - name: GEMINI_MODEL
              value: {{ .Values.backend.ai.gemini.model | quote }}
            {{- if .Values.backend.ai.ollama.url }}
            - name: OLLAMA_URL
              value: {{ .Values.backend.ai.ollama.url | quote }}
            {{- end }}
            - name: OLLAMA_MODEL
              value: {{ .Values.backend.ai.ollama.model | quote }}
            - name: DEFAULT_LLM_PROVIDER
              value: {{ .Values.backend.ai.defaultProvider | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infralens.fullname" . }}-backend
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "infralens.backend.selectorLabels" . | nindent 4 }}
{{- end }}
