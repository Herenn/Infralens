{{- if or .Values.backend.ai.openai.apiKey .Values.backend.ai.anthropic.apiKey .Values.backend.ai.gemini.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infralens.fullname" . }}-secrets
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.ai.openai.apiKey }}
  openai-api-key: {{ .Values.backend.ai.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.ai.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.backend.ai.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.ai.gemini.apiKey }}
  gemini-api-key: {{ .Values.backend.ai.gemini.apiKey | quote }}
  {{- end }}
{{- end }}
