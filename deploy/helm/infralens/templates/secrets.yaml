{{- $uiAuthInChartSecret := and (not .Values.backend.auth.existingSecret) (or .Values.backend.auth.uiPassword .Values.backend.auth.sessionSecret) }}
{{- if or .Values.backend.ai.openai.apiKey .Values.backend.ai.anthropic.apiKey .Values.backend.ai.gemini.apiKey .Values.backend.auth.apiKey .Values.backend.drift.webhookUrl $uiAuthInChartSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infralens.fullname" . }}-secrets
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.ai.openai.apiKey }}
  openai-api-key: {{ .Values.backend.ai.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.ai.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.backend.ai.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.ai.gemini.apiKey }}
  gemini-api-key: {{ .Values.backend.ai.gemini.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.auth.apiKey }}
  api-key: {{ .Values.backend.auth.apiKey | quote }}
  {{- end }}
  {{- if .Values.backend.drift.webhookUrl }}
  drift-webhook-url: {{ .Values.backend.drift.webhookUrl | quote }}
  {{- end }}
  {{- if not .Values.backend.auth.existingSecret }}
  {{- if .Values.backend.auth.uiPassword }}
  ui-password: {{ .Values.backend.auth.uiPassword | quote }}
  {{- end }}
  {{- if .Values.backend.auth.sessionSecret }}
  session-secret: {{ .Values.backend.auth.sessionSecret | quote }}
  {{- end }}
  {{- end }}
{{- end }}
