{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infralens.fullname" . }}-frontend
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "infralens.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infralens.frontend.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Where the bundled nginx proxies /api/ and /mcp (rendered into its
            # config at start - see frontend/nginx.conf). The image default,
            # http://backend:8080, only resolves under docker-compose. Must be
            # scheme://host:port with no path: a trailing slash is dropped,
            # anything else with a path is refused.
            {{- $backendURL := .Values.frontend.backendUrl | default (printf "http://%s-backend:%v" (include "infralens.fullname" .) .Values.backend.service.port) | trimSuffix "/" }}
            {{- if not (regexMatch "^https?://[^/?#]+$" $backendURL) }}
            {{- fail (printf "frontend.backendUrl must be scheme://host:port with no path (got %q)" $backendURL) }}
            {{- end }}
            - name: INFRALENS_BACKEND_URL
              value: {{ $backendURL | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "infralens.fullname" . }}-frontend
  labels:
    {{- include "infralens.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "infralens.frontend.selectorLabels" . | nindent 4 }}
{{- end }}
