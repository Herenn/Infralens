# InfraLens Helm Chart Values
# ===========================

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Namespace
namespace: infralens

# ===========================
# Backend Configuration
# ===========================
backend:
  # Keep at 1: the backend's default store is SQLite, a single-writer database
  # in a single file. More than one replica means concurrent writers to one
  # volume (same node) or pods that cannot schedule at all (ReadWriteOnce,
  # different nodes). Scaling out needs DB_DRIVER=postgres first - which the
  # chart does not yet expose; use extraEnv.
  #
  # Topology history (v3). Retention is measured in days and is what decides
  # how far back the timeline can scrub.
  history:
    enabled: true
    retention: 720h
    maxGap: 5m

  # Architecture drift: a dependency appears that has never been seen before
  # (flagging ones that reach the public internet) or an established one
  # stops being observed. Since v3.1 detection runs whenever history is
  # enabled and records every change in the UI's Changes feed; the timings
  # below apply to it with or without a webhook. Optionally it also POSTs to
  # webhookUrl (Slack/Mattermost incoming webhooks work as-is); the URL is
  # stored in the chart's Secret, since such URLs embed their credential.
  drift:
    # false switches drift detection (feed and webhook) off entirely.
    enabled: true
    webhookUrl: ""
    # Timings; empty uses the backend default shown (demo mode uses 15s / 5m
    # / no warmup unless these are set).
    # How often history is checked for changes (default 5m).
    checkInterval: ""
    # How long a dependency must go unobserved before it is reported gone
    # (default 24h). Long on purpose: this is drift, not outage alerting.
    goneAfter: ""
    # Suppresses "new dependency" reports for the first hour of history, so
    # a fresh install does not announce the whole cluster (default 1h; "0s"
    # disables).
    warmup: ""

  # Idle spend (v3.1, beta): cleanup candidates - services nothing talks to -
  # with network evidence and an approximate share of their node's price.
  # Candidates to verify, not recommendations to delete. No prices are built
  # in: with nodeMonthly and the rules empty the panel shows evidence only.
  # Prices are monthly amounts in `currency` (a label; no conversion).
  # Per-node pricing needs per-node agents: with agent.clusterName set (the
  # default "Kubernetes") every node reports under one group, and only a
  # low-confidence cluster-wide split is possible - set it to "" for per-node
  # attribution. Node rules match the real agent node names either way.
  # Durations accept a day suffix ("7d").
  idleCost:
    # Default monthly cost of one node, e.g. "140".
    nodeMonthly: ""
    # Per-node overrides, glob=price, ";"-separated: "gpu-*=1800;db-1=420".
    nodePrices: ""
    # Per-service prices (name/ID glob=price), used instead of a node share -
    # also the only way to price a node-less endpoint such as a managed DB.
    servicePrices: ""
    currency: USD
    # Globs never flagged (known cron jobs, DR standbys): "nightly-*;dr-*".
    exclude: ""
    # History consulted (clamped to history.retention), how long without
    # inbound traffic before a service is flagged, and how long a service
    # (and history itself) must exist before anything is flagged.
    window: 720h
    quietAfter: 72h
    warmup: 24h

  # MCP (Model Context Protocol) endpoint at /mcp, so AI assistants (Claude
  # Code, Claude Desktop, Cursor, ...) can query the topology: read-only tools,
  # Streamable HTTP. When any key is set (auth.apiKey or mcp.apiKey) /mcp
  # requires one. With neither: if auth.uiPassword is set /mcp refuses every
  # request (it never bypasses the UI login); otherwise it is open only if
  # auth.allowNoAuth is true. The UI session cookie never authenticates /mcp.
  mcp:
    enabled: true
    # Read-only key accepted on /mcp only - give this to AI clients instead of
    # the agents' write-capable auth.apiKey. Stored in the chart's Secret.
    # Generate one with: openssl rand -hex 32
    apiKey: ""
    # Extra browser origins allowed to call /mcp (comma-separated). Loopback
    # origins and non-browser clients are always allowed.
    allowedOrigins: ""

  # Persistence for the backend's SQLite database. Disabled by default keeps
  # the quick-start single-command, but history does NOT survive a restart
  # without it - unlike current state, it cannot be re-derived by the agents.
  # Turn this on before relying on the timeline, diff, or decommission views.
  #
  # Enabling this also switches the Deployment to the Recreate strategy, since
  # a ReadWriteOnce volume cannot be handed between two pods during a rolling
  # update. Expect a brief gap on redeploy instead of an overlap.
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    # Keep the volume when the release is uninstalled or a failed upgrade rolls
    # back. History cannot be re-derived, so the default protects it; the cost
    # is an orphaned PVC you delete by hand.
    retainOnDelete: true

  # Arbitrary extra environment variables, so a new backend setting does not
  # require a chart release to become reachable.
  extraEnv: []

  # Must match the nonroot uid/gid baked into the distroless backend image.
  # fsGroup is what makes the volume mounted at /data writable by it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/herenn/infralens/backend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # API key for agent -> backend authentication.
  # When set, ingestion endpoints require this key and agents send it automatically.
  # Generate one with: openssl rand -hex 32
  auth:
    apiKey: ""
    # The backend refuses to start without apiKey unless this is set to true.
    # Only enable it for evaluation or a trusted, isolated network.
    allowNoAuth: false
  
    # UI login (v3.1). When uiPassword is set, the UI shows a login screen and
    # every read endpoint and the WebSocket require a session or the apiKey.
    # Empty keeps v3.0 behaviour: reads are public. Stored in the chart's
    # Secret. Use a long random value: openssl rand -base64 24
    uiPassword: ""
    uiUsername: "admin"
    # Signs session cookies. Optional with one replica (a random per-process
    # key is used, so a restart signs everyone out); required for sessions to
    # survive restarts or work across replicas. At least 32 characters:
    # openssl rand -hex 32
    sessionSecret: ""
    # Absolute session lifetime; users sign in again after it.
    sessionTTL: 12h
    # Name of an existing Secret to read the UI credentials from instead of
    # the values above. Keys: "ui-password" (required) and "session-secret"
    # (optional). Pods are not restarted when it changes.
    existingSecret: ""
    # Whose X-Forwarded-For to believe when throttling logins per client.
    # Empty (default): connections from loopback/private addresses (the
    # ingress controller, the frontend's nginx) are proxies, one hop. Set an
    # explicit CIDR list if untrusted clients can reach the backend directly
    # from private addresses, or for multi-hop chains; "none" to ignore.
    trustedProxies: ""

  # Demo mode - simulate a live topology without any agents (for evaluation)
  demoMode: false
  
  # AI Documentation Configuration
  ai:
    # OpenAI
    openai:
      apiKey: ""
      model: ""  # empty = backend default (gpt-6-luna)
    # Anthropic
    anthropic:
      apiKey: ""
      model: ""  # empty = backend default (claude-haiku-5-5)
    # Google Gemini
    gemini:
      apiKey: ""
      model: ""  # empty = backend default (gemini-3.5-flash-lite)
    # Ollama (local)
    ollama:
      url: ""
      model: ""  # empty = first installed local model
    # Default provider
    defaultProvider: "openai"

# ===========================
# Frontend Configuration
# ===========================
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/herenn/infralens/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ===========================
# Agent Configuration (DaemonSet)
# ===========================
agent:
  enabled: true
  
  image:
    repository: ghcr.io/herenn/infralens/agent
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # Backend connection settings
  # If externalBackend.enabled is true, agents connect to an external backend (outside the cluster)
  # If false, agents connect to the in-cluster backend service
  externalBackend:
    enabled: false
    # URL of external backend (e.g., "http://your-server-ip:8080")
    url: ""
  
  # Cluster name - groups all K8s nodes under this name in the UI
  # If empty, each node appears separately
  clusterName: "Kubernetes"

  # EXPERIMENTAL, off by default: show DNS names (api.stripe.com) instead of
  # bare IPs for destinations. The agent learns them from DNS queries and
  # their matching answers seen on the node (AF_PACKET capture, needs
  # CAP_NET_RAW - granted by privileged mode). Names are only reported for
  # destinations a workload actually connected to. Names are display labels,
  # not verified facts: whoever controls a workload's resolver controls its
  # labels. If capture cannot start, the agent logs once and reports IPs.
  dnsNames: false
  # Tuning for DNS name capture, used only with dnsNames: true. Empty keeps
  # the agent's defaults.
  dns:
    # Max captured DNS packets processed per second (agent default 5000);
    # the excess is dropped by the kernel.
    maxPPS: ""
    # Max (client, IP) pairs kept in the name cache.
    cacheSize: ""
    # How often to log capture counters, e.g. "5m"; "0" disables.
    statsInterval: ""

  # Agent runs with elevated privileges for eBPF
  securityContext:
    privileged: true
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Node selector for agent deployment
  nodeSelector: {}
  
  # Tolerations for agent (e.g., to run on master nodes)
  tolerations:
    - operator: Exists
      effect: NoSchedule

# ===========================
# Ingress Configuration
# ===========================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: infralens.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /mcp
          pathType: Prefix
          service: backend
  tls: []
    # - secretName: infralens-tls
    #   hosts:
    #     - infralens.local

# ===========================
# Service Account
# ===========================
serviceAccount:
  create: true
  name: "infralens"
  annotations: {}

# ===========================
# RBAC Configuration
# ===========================
rbac:
  create: true
