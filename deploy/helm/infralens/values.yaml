# InfraLens Helm Chart Values
# ===========================

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

# Namespace
namespace: infralens

# ===========================
# Backend Configuration
# ===========================
backend:
  # Keep at 1: the backend's default store is SQLite, a single-writer database
  # in a single file. More than one replica means concurrent writers to one
  # volume (same node) or pods that cannot schedule at all (ReadWriteOnce,
  # different nodes). Scaling out needs DB_DRIVER=postgres first - which the
  # chart does not yet expose; use extraEnv.
  #
  # Topology history (v3). Retention is measured in days and is what decides
  # how far back the timeline can scrub.
  history:
    enabled: true
    retention: 720h
    maxGap: 5m

  # Architecture drift notifications (v3): POST to a webhook when a dependency
  # appears that has never been seen before (flagging ones that reach the
  # public internet) or an established one stops being observed. Works with
  # Slack/Mattermost incoming webhooks as-is. Off unless webhookUrl is set;
  # needs history.enabled. The URL is stored in the chart's Secret, since
  # Slack-style webhook URLs embed their credential.
  drift:
    # Drift detection and the in-UI Changes feed (v3.1). Runs whenever
    # history is enabled; the webhook below is optional. false switches the
    # feature off entirely.
    enabled: true
    webhookUrl: ""
    checkInterval: 5m
    # How long a dependency must go unobserved before it is reported gone.
    # Long on purpose: this is drift, not outage alerting.
    goneAfter: 24h
    # Suppresses "new dependency" reports for the first hour of history, so
    # a fresh install does not announce the whole cluster.
    warmup: 1h

  # Persistence for the backend's SQLite database. Disabled by default keeps
  # the quick-start single-command, but history does NOT survive a restart
  # without it - unlike current state, it cannot be re-derived by the agents.
  # Turn this on before relying on the timeline, diff, or decommission views.
  #
  # Enabling this also switches the Deployment to the Recreate strategy, since
  # a ReadWriteOnce volume cannot be handed between two pods during a rolling
  # update. Expect a brief gap on redeploy instead of an overlap.
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    # Keep the volume when the release is uninstalled or a failed upgrade rolls
    # back. History cannot be re-derived, so the default protects it; the cost
    # is an orphaned PVC you delete by hand.
    retainOnDelete: true

  # Arbitrary extra environment variables, so a new backend setting does not
  # require a chart release to become reachable.
  extraEnv: []

  # Must match the nonroot uid/gid baked into the distroless backend image.
  # fsGroup is what makes the volume mounted at /data writable by it.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532

  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/herenn/infralens/backend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 8080
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # API key for agent -> backend authentication.
  # When set, ingestion endpoints require this key and agents send it automatically.
  # Generate one with: openssl rand -hex 32
  auth:
    apiKey: ""
    # The backend refuses to start without apiKey unless this is set to true.
    # Only enable it for evaluation or a trusted, isolated network.
    allowNoAuth: false
  
    # UI login (v3.1). When uiPassword is set, the UI shows a login screen and
    # every read endpoint and the WebSocket require a session or the apiKey.
    # Empty keeps v3.0 behaviour: reads are public. Stored in the chart's
    # Secret. Use a long random value: openssl rand -base64 24
    uiPassword: ""
    uiUsername: "admin"
    # Signs session cookies. Optional with one replica (a random per-process
    # key is used, so a restart signs everyone out); required for sessions to
    # survive restarts or work across replicas. At least 32 characters:
    # openssl rand -hex 32
    sessionSecret: ""
    # Absolute session lifetime; users sign in again after it.
    sessionTTL: 12h
    # Name of an existing Secret to read the UI credentials from instead of
    # the values above. Keys: "ui-password" (required) and "session-secret"
    # (optional). Pods are not restarted when it changes.
    existingSecret: ""
    # Whose X-Forwarded-For to believe when throttling logins per client.
    # Empty (default): connections from loopback/private addresses (the
    # ingress controller, the frontend's nginx) are proxies, one hop. Set an
    # explicit CIDR list if untrusted clients can reach the backend directly
    # from private addresses, or for multi-hop chains; "none" to ignore.
    trustedProxies: ""

  # Demo mode - simulate a live topology without any agents (for evaluation)
  demoMode: false
  
  # AI Documentation Configuration
  ai:
    # OpenAI
    openai:
      apiKey: ""
      model: "gpt-3.5-turbo"
    # Anthropic
    anthropic:
      apiKey: ""
      model: "claude-3-haiku-20240307"
    # Google Gemini
    gemini:
      apiKey: ""
      model: "gemini-pro"
    # Ollama (local)
    ollama:
      url: ""
      model: "llama2"
    # Default provider
    defaultProvider: "openai"

# ===========================
# Frontend Configuration
# ===========================
frontend:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/herenn/infralens/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3000
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ===========================
# Agent Configuration (DaemonSet)
# ===========================
agent:
  enabled: true
  
  image:
    repository: ghcr.io/herenn/infralens/agent
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # Backend connection settings
  # If externalBackend.enabled is true, agents connect to an external backend (outside the cluster)
  # If false, agents connect to the in-cluster backend service
  externalBackend:
    enabled: false
    # URL of external backend (e.g., "http://your-server-ip:8080")
    url: ""
  
  # Cluster name - groups all K8s nodes under this name in the UI
  # If empty, each node appears separately
  clusterName: "Kubernetes"

  # EXPERIMENTAL, off by default: show DNS names (api.stripe.com) instead of
  # bare IPs for destinations. The agent learns them from DNS queries and
  # their matching answers seen on the node (AF_PACKET capture, needs
  # CAP_NET_RAW - granted by privileged mode). Names are only reported for
  # destinations a workload actually connected to. Names are display labels,
  # not verified facts: whoever controls a workload's resolver controls its
  # labels. If capture cannot start, the agent logs once and reports IPs.
  dnsNames: false

  # Agent runs with elevated privileges for eBPF
  securityContext:
    privileged: true
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  # Node selector for agent deployment
  nodeSelector: {}
  
  # Tolerations for agent (e.g., to run on master nodes)
  tolerations:
    - operator: Exists
      effect: NoSchedule

# ===========================
# Ingress Configuration
# ===========================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: infralens.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
  tls: []
    # - secretName: infralens-tls
    #   hosts:
    #     - infralens.local

# ===========================
# Service Account
# ===========================
serviceAccount:
  create: true
  name: "infralens"
  annotations: {}

# ===========================
# RBAC Configuration
# ===========================
rbac:
  create: true
