name: CI

on:
  push:
    branches: [main, features]
  pull_request:
    branches: [main, features]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # only-new-issues below needs the base branch's history to diff
          # against; the default shallow clone (depth 1) doesn't have it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build Backend
        run: |
          cd backend
          go build -v ./...

      - name: Lint Backend
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          version: latest
          # Scoped to lines this PR/push touches, not the whole tree: main
          # currently carries ~60 pre-existing errcheck/staticcheck findings
          # never gated on before. Ratchet the bar for new code instead of
          # gating the whole backend on a debt backlog nobody signed up to
          # fix in this change.
          only-new-issues: true

      - name: Test Backend
        run: |
          cd backend
          go test -v ./...

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infralens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Test Backend (PostgreSQL)
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/infralens_test?sslmode=disable
        run: |
          cd backend
          go test -race ./storage/postgres/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

  agent:
    name: Agent (eBPF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Install bpf2go
        run: go install github.com/cilium/ebpf/cmd/bpf2go@v0.12.3

      - name: Generate eBPF bindings
        run: |
          cd agent/collector
          go generate ./...

      - name: Build Agent
        run: |
          cd agent
          go build -v -o infralens-agent .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, backend-postgres, frontend, agent]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: infralens/backend:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: infralens/frontend:test

      - name: Build Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.agent
          push: false
          tags: infralens/agent:test
