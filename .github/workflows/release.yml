name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      # The release notes must match what docker/metadata-action actually
      # publishes in the docker-images job below:
      #   - image paths are lowercased (Docker rejects uppercase repository
      #     names outright), so github.repository can't be used verbatim
      #   - type=semver,pattern={{version}} strips the leading "v", so the
      #     image tag is 2.0.1, not the tag name v2.0.1
      - name: Compute image reference
        id: image_ref
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## What's Changed

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ## Docker Images

            ```bash
            docker pull ghcr.io/${{ steps.image_ref.outputs.repository }}/agent:${{ steps.image_ref.outputs.version }}
            docker pull ghcr.io/${{ steps.image_ref.outputs.repository }}/backend:${{ steps.image_ref.outputs.version }}
            docker pull ghcr.io/${{ steps.image_ref.outputs.repository }}/frontend:${{ steps.image_ref.outputs.version }}
            ```
            
            ## Helm Installation
            
            ```bash
            helm install infralens ./deploy/helm/infralens -n infralens --create-namespace
            ```

  build-agent:
    name: Build Agent Binary
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install LLVM/Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev

      - name: Install bpf2go
        run: go install github.com/cilium/ebpf/cmd/bpf2go@v0.12.3

      - name: Generate eBPF bindings
        run: |
          cd agent/collector
          go generate ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd agent
          go build -ldflags="-s -w" -o ../infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          asset_name: infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          asset_content_type: application/octet-stream

      # The agent verifies this before installing an update. Without a
      # published digest a self-updating agent has no way to tell a genuine
      # release binary from anything else it was pointed at.
      - name: Generate checksum
        run: |
          sha256sum "infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }}" \
            | awk '{print $1}' > "infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"

      - name: Upload Checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          asset_name: infralens-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          asset_content_type: text/plain

  docker-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: agent
            dockerfile: Dockerfile.agent
            context: .
          - name: backend
            dockerfile: Dockerfile.backend
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Releases only run on tag pushes, where is_default_branch is always
            # false - tag latest unconditionally so compose/Helm defaults work
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
