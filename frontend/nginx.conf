# Served as an nginx image template: the Dockerfile installs this file as
# /etc/nginx/templates/default.conf.template, and the image's entrypoint
# substitutes ${INFRALENS_BACKEND_URL} (only variables defined in the
# environment are substituted; nginx's own $variables are left alone) into
# /etc/nginx/conf.d/default.conf at start. The default (Dockerfile) is
# http://backend:8080, the docker-compose service name; Helm and the raw
# Kubernetes manifests set it to their backend Service.
#
# INFRALENS_BACKEND_URL must be scheme://host:port and nothing else - no path,
# no trailing slash. A URI part in proxy_pass replaces the matched location
# prefix (a trailing "/" would turn /api/v1/... into /v1/...), and nginx
# refuses to start at all with a URI part in the regex /mcp location below.

# Pass on the scheme an outer TLS-terminating proxy (ingress, load balancer)
# reported, rather than overwriting it with this hop's plain-http $scheme: the
# backend uses X-Forwarded-Proto to mark the UI session cookie Secure.
map $http_x_forwarded_proto $infralens_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# The Host the browser used, port included ($host drops the port). With UI
# login the backend compares a WebSocket's Origin against it - browsers send
# no Sec-Fetch-Site on WebSocket handshakes - so on :3000 or behind
# `kubectl port-forward` the port matters. An outer proxy's value wins.
map $http_x_forwarded_host $infralens_forwarded_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass ${INFRALENS_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $infralens_forwarded_proto;
        proxy_set_header X-Forwarded-Host $infralens_forwarded_host;
        
        # WebSocket support
        proxy_read_timeout 86400;
    }

    # MCP endpoint for AI assistants (served by the backend), exactly /mcp
    # or /mcp/. Same forwarding headers as /api/ so the backend sees one
    # consistent picture of the client; /mcp enforces its own key auth and
    # Origin policy (MCP_ALLOWED_ORIGINS) and never uses the session cookie.
    # Responses are plain JSON, so no WebSocket upgrade or long timeout.
    location ~ ^/mcp/?$ {
        proxy_pass ${INFRALENS_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $infralens_forwarded_proto;
        proxy_set_header X-Forwarded-Host $infralens_forwarded_host;
        proxy_buffering off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
